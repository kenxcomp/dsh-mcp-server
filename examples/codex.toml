[mcp_servers.deepseek-harness]
command = "/absolute/path/to/node"
args = ["--env-file=/absolute/protected.env", "/absolute/path/to/dsh-mcp-server/dist/index.js"]
startup_timeout_sec = 20
tool_timeout_sec = 30

[mcp_servers.deepseek-harness.env]
DSH_MCP_COMMAND = "/absolute/path/to/dsh"
DSH_MCP_WORKSPACE_ROOTS = '["/absolute/path/to/project"]'
DSH_MCP_MODEL = "deepseek-v4-flash"
DSH_MCP_PROVIDER = "deepseek-official"
